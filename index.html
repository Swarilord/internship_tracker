button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }

.mono { font-family: 'JetBrains Mono', monospace; }

.card-enter { animation: fadeIn 0.25s ease-out; }

main { padding: 24px 0 80px; padding-bottom: calc(80px + env(safe-area-inset-bottom, 0)); }

/* ============================================================
   STATE & STORAGE
   ============================================================ */

const STORAGE_KEY = 'eth-internship-tracker-v2';
const LIVE_CACHE_TTL = 3600000; // 1 hour

const loadData = () => {
  try {
    // Try v2 first
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    // Migrate from v1
    const oldRaw = localStorage.getItem('eth-internship-tracker-v1');
    if (oldRaw) {
      const parsed = JSON.parse(oldRaw);
      const migrated = { apps: parsed.apps || {}, alerts: parsed.alerts || {}, live: {} };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
      return migrated;
    }
    return { apps: {}, alerts: {}, live: {} };
  } catch { return { apps: {}, alerts: {}, live: {} }; }
};

const saveData = (d) => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) { console.error(e); }
};

let state = {
  data: loadData(),
  view: 'dashboard',
  filter: 'All',
  statusFilter: 'all',
  search: '',
  openCard: null,
  editingNote: null,
  noteDraft: '',
  liveFetching: {}, // tracks in-progress fetches
};

const persist = () => saveData(state.data);
const setState = (patch) => { Object.assign(state, patch); render(); };

const updateApp = (id, patch) => {
  state.data.apps[id] = { ...(state.data.apps[id] || {}), ...patch };
  persist();
  render();
};

const toggleAlert = (id) => {
  state.data.alerts[id] = !state.data.alerts[id];
  persist();
  render();
};

const resetAll = () => {
  if (confirm('Reset all tracking data? This cannot be undone.')) {
    state.data = { apps: {}, alerts: {}, live: {} };
    persist();
    render();
  }
};

const exportData = () => {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'internship-tracker-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
};

const importData = () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (parsed && typeof parsed === 'object' && parsed.apps !== undefined) {
          if (confirm('Import data and overwrite current state?')) {
            state.data = { apps: parsed.apps || {}, alerts: parsed.alerts || {}, live: parsed.live || {} };
            persist(); render();
          }
        } else { alert('Invalid file format.'); }
      } catch { alert('Could not parse file.'); }
    };
    reader.readAsText(file);
  };
  input.click();
};

/* ============================================================
   GREENHOUSE LIVE API
   ============================================================ */

async function fetchGreenhouseJobs(slug, isEu = false) {
  const cacheKey = slug + (isEu ? ':eu' : '');
  const cached = state.data.live[cacheKey];
  if (cached && (Date.now() - cached.time < LIVE_CACHE_TTL)) {
    return { data: cached.data, fromCache: true };
  }
  const base = isEu ? 'https://boards-api.eu.greenhouse.io' : 'https://boards-api.greenhouse.io';
  const url = `${base}/v1/boards/${slug}/jobs?content=true`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const allJobs = (json.jobs || []).map(j => ({
      title: j.title || '',
      location: (j.location && j.location.name) || '',
      url: j.absolute_url || '',
      updated: j.updated_at || '',
    }));
    const data = { total: allJobs.length, jobs: allJobs, fetchedAt: new Date().toISOString() };
    state.data.live[cacheKey] = { time: Date.now(), data };
    persist();
    return { data, fromCache: false };
  } catch (e) {
    return { error: e.message || 'Fetch failed' };
  }
}

function filterInternshipJobs(jobs) {
  if (!jobs) return [];
  const kw = /intern|graduate|summer|trainee|2027|early career|junior|new grad/i;
  return jobs.filter(j => kw.test(j.title));
}

async function refreshLiveData() {
  const liveCompanies = COMPANIES.filter(c => c.greenhouseSlug);
  for (const c of liveCompanies) {
    state.liveFetching[c.id] = true;
  }
  render();
  await Promise.all(liveCompanies.map(async (c) => {
    await fetchGreenhouseJobs(c.greenhouseSlug, c.greenhouseEu);
    state.liveFetching[c.id] = false;
    // Auto-mark as verified
    if (state.data.live[c.greenhouseSlug + (c.greenhouseEu ? ':eu' : '')]?.data) {
      updateApp(c.id, { lastChecked: new Date().toISOString() });
    }
  }));
  render();
}

async function refreshSingleLive(id) {
  const c = COMPANIES.find(x => x.id === id);
  if (!c?.greenhouseSlug) return;
  state.liveFetching[id] = true;
  render();
  await fetchGreenhouseJobs(c.greenhouseSlug, c.greenhouseEu);
  state.liveFetching[id] = false;
  updateApp(id, { lastChecked: new Date().toISOString() });
}

/* ============================================================
   VERIFY & BATCH OPEN
   ============================================================ */

const verifyAndOpen = (id, url) => {
  window.open(url, '_blank', 'noopener,noreferrer');
  updateApp(id, { lastChecked: new Date().toISOString() });
};

const batchOpenUrgent = () => {
  const urgent = COMPANIES.map(enrich)
    .filter(c => c.status === 'todo' && monthsFromNow(c.urgencyMonth) <= 1)
    .sort((a, b) => (a.priority - b.priority) || (a.urgencyMonth.localeCompare(b.urgencyMonth)))
    .slice(0, 5);
  if (urgent.length === 0) { alert('Nothing urgent to open.'); return; }
  let blocked = 0;
  const now = new Date().toISOString();
  urgent.forEach((c, i) => {
    setTimeout(() => {
      const w = window.open(c.url, '_blank', 'noopener,noreferrer');
      if (!w) blocked++;
      state.data.apps[c.id] = { ...(state.data.apps[c.id] || {}), lastChecked: now };
      if (i === urgent.length - 1) {
        persist();
        if (blocked > 0) alert(`Your browser blocked ${blocked} popup(s). Allow popups for this page and try again.`);
        render();
      }
    }, i * 100);
  });
};

/* ============================================================
   UTILITIES
   ============================================================ */

const CURRENT_REF = new Date();
const monthsFromNow = (mStr) => {
  const [y, m] = mStr.split('-').map(Number);
  return (y - CURRENT_REF.getFullYear()) * 12 + (m - 1 - CURRENT_REF.getMonth());
};

const daysSince = (iso) => {
  if (!iso) return null;
  const then = new Date(iso).getTime();
  return Math.floor((Date.now() - then) / 86400000);
};

const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const enrich = (c) => ({
  ...c,
  status: state.data.apps[c.id]?.status || 'todo',
  userNote: state.data.apps[c.id]?.note || '',
  appliedDate: state.data.apps[c.id]?.appliedDate,
  lastChecked: state.data.apps[c.id]?.lastChecked,
});

const verifyLabel = (c) => {
  const isUrgentish = monthsFromNow(c.urgencyMonth) <= 2;
  const isMonitoring = c.status === 'not_open';
  const d = daysSince(c.lastChecked);
  if (d === null) {
    return { text: c.greenhouseSlug ? 'Live data not loaded' : (isMonitoring ? 'Not checked yet — verify cycle status' : 'Not verified'), cls: (isUrgentish || isMonitoring) ? 'stale' : '' };
  }
  if (d === 0) return { text: 'Checked today', cls: 'fresh' };
  if (d === 1) return { text: 'Checked yesterday', cls: 'fresh' };
  if (d <= 6) return { text: `Checked ${d}d ago`, cls: 'fresh' };
  if (isMonitoring) return { text: `Checked ${d}d ago — recheck weekly`, cls: 'stale' };
  if (d <= 13) return { text: `Verified ${d}d ago`, cls: '' };
  return { text: `Verified ${d}d ago — stale`, cls: isUrgentish ? 'stale' : '' };
};

function render() {
  const root = document.getElementById('root');
  const stats = computeStats();
  root.innerHTML = `
    <div class="app">
      ${headerHtml(stats)}
      ${tabsHtml()}
      <main><div class="wrap">${viewHtml()}</div></main>
    </div>
  `;
  attachListeners();
}

function computeStats() {
  const all = COMPANIES.map(enrich);
  const s = { total: all.length, todo: 0, applied: 0, interview: 0, offer: 0, rejected: 0, skipped: 0 };
  all.forEach(c => { s[c.status] = (s[c.status] || 0) + 1; });
  return s;
}

  ];
  return `<nav class="tabs"><div class="wrap"><div class="tabs-inner">
    ${tabs.map(t => `<button class="tab ${state.view === t.id ? 'active' : ''}" data-tab="${t.id}">${icons[t.icon]} ${t.label}</button>`).join('')}
  </div></div></nav>`;
}

function viewHtml() {
  if (state.view === 'dashboard') return dashboardHtml();
  if (state.view === 'all') return allFirmsHtml();
  if (state.view === 'submitted') return submittedHtml();
  if (state.view === 'alerts') return alertsHtml();
  return '';
}

function dashboardHtml() {
  const stats = computeStats();
  const all = COMPANIES.map(enrich);
  const urgent = all.filter(c => c.status === 'todo' && monthsFromNow(c.urgencyMonth) <= 1)
    .sort((a, b) => (a.priority - b.priority) || a.urgencyMonth.localeCompare(b.urgencyMonth));
  const upcoming = all.filter(c => c.status === 'todo' && monthsFromNow(c.urgencyMonth) > 1 && monthsFromNow(c.urgencyMonth) <= 4)
    .sort((a, b) => a.urgencyMonth.localeCompare(b.urgencyMonth) || (a.priority - b.priority));
  const monitoring = all.filter(c => c.status === 'not_open')
    .sort((a, b) => (a.priority - b.priority) || a.urgencyMonth.localeCompare(b.urgencyMonth));
  const later = all.filter(c => c.status === 'todo' && monthsFromNow(c.urgencyMonth) > 4)
    .sort((a, b) => a.urgencyMonth.localeCompare(b.urgencyMonth));

  const liveCount = COMPANIES.filter(c => c.greenhouseSlug).length;
  const fetching = Object.values(state.liveFetching).some(Boolean);

  return `
    <div class="disclaimer">
      <div class="disclaimer-title">⚠ Data freshness</div>
      <div class="disclaimer-body">
        Static fields (deadlines, opening windows) are based on prior cycles and may be off by weeks. ${liveCount} firms have <strong>LIVE</strong> integration via Greenhouse API showing current open postings. For all other firms, use the "Verify & Open" button to mark when you last confirmed the careers page yourself. For firms where the 2027 cycle hasn't appeared yet, mark them <strong>"Not Open Yet"</strong> — they move to a separate Monitoring section and prompt weekly rechecks.
      </div>
    </div>

    <div class="batch-bar">
      <div class="batch-bar-text">
        <strong>${urgent.length}</strong> urgent · 
        <strong>${monitoring.length}</strong> monitoring · 
        <strong>${liveCount}</strong> live · 
        Quick actions:
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="batch-btn" id="batch-open-btn" ${urgent.length === 0 ? 'disabled style="opacity:0.4"' : ''}>${icons.zap} Open top 5 urgent</button>
        <button class="batch-btn secondary" id="refresh-live-btn">${fetching ? '<span class="spin">⟳</span>' : icons.refresh} Refresh live data</button>
      </div>
    </div>

    <div class="stats">
      ${[['todo','To do','#0F1419'],['applied','Applied','#2563EB'],['interview','Interview','#7C3AED'],['offer','Offer','#15803D']].map(([k,l,c]) => `
        <div class="stat"><div class="stat-num" style="color:${c}">${stats[k]}</div><div class="stat-lbl">${l}</div></div>
      `).join('')}
    </div>

    <section class="section">
      <div class="section-head accent"><div>
        <h2 class="section-title accent">Action this week</h2>
        <div class="section-sub">${urgent.length} firm${urgent.length === 1 ? '' : 's'} need attention now</div>
      </div></div>
      ${urgent.length === 0 ? '<div class="empty">Nothing urgent. Use this time on your Basisprüfung.</div>' : urgent.map(c => cardHtml(c, true)).join('')}
    </section>

    <section class="section">
      <div class="section-head"><div>
        <h2 class="section-title">Coming up</h2>
        <div class="section-sub">${upcoming.length} opening in the next 2–4 months</div>
      </div></div>
      ${upcoming.length === 0 ? '<div class="empty">Nothing in the queue.</div>' : upcoming.map(c => cardHtml(c, false)).join('')}
    </section>

    ${monitoring.length > 0 ? `
      <section class="section">
        <div class="section-head" style="border-bottom-color:#D97706"><div>
          <h2 class="section-title" style="color:#92400E">Monitoring</h2>
          <div class="section-sub">${monitoring.length} firm${monitoring.length === 1 ? '' : 's'} where 2027 cycle hasn't opened yet · recheck weekly</div>
        </div></div>
        ${monitoring.map(c => cardHtml(c, false)).join('')}
      </section>
    ` : ''}

    ${later.length > 0 ? `
      <section class="section">
        <div class="section-head"><div>
          <h2 class="section-title">Later</h2>
          <div class="section-sub">${later.length} firms, track but don't worry yet</div>
        </div></div>
        ${later.map(c => cardHtml(c, false)).join('')}
      </section>
    ` : ''}
  `;
}

function allFirmsHtml() {
  let filtered = COMPANIES.map(enrich);
  if (state.filter !== 'All') filtered = filtered.filter(c => c.category === state.filter);
  if (state.statusFilter !== 'all') filtered = filtered.filter(c => c.status === state.statusFilter);
  if (state.search) {
    const q = state.search.toLowerCase();
    filtered = filtered.filter(c => (c.name + ' ' + c.role).toLowerCase().includes(q));
  }
  filtered.sort((a, b) => a.urgencyMonth.localeCompare(b.urgencyMonth) || (a.priority - b.priority));

  return `
    <div style="margin-bottom:20px">
      <div class="search-wrap">${icons.search}<input class="search-input" id="search-input" placeholder="Search firms..." value="${escapeHtml(state.search)}" /></div>
      <div class="chip-row">
        ${CATEGORIES.map(cat => `<button class="chip ${state.filter === cat ? 'active' : ''}" data-filter="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`).join('')}
      </div>
      <div class="chip-row">
        ${[['all','All status'],['todo','To do'],['not_open','Not open yet'],['applied','Applied'],['interview','Interview'],['offer','Offer'],['rejected','Rejected'],['skipped','Skipped']].map(([k,l]) => `<button class="chip chip-sm ${state.statusFilter === k ? 'active' : ''}" data-statusfilter="${k}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="mono" style="font-size:11px;color:#8B7355;margin-bottom:12px">${filtered.length} result${filtered.length === 1 ? '' : 's'}</div>
    ${filtered.length === 0 ? '<div class="empty">No firms match these filters.</div>' : filtered.map(c => cardHtml(c, false)).join('')}
  `;
}

function submittedHtml() {
  const submitted = COMPANIES.map(enrich).filter(c => ['applied','interview','offer'].includes(c.status))
    .sort((a, b) => (b.appliedDate || '').localeCompare(a.appliedDate || ''));
  if (submitted.length === 0) {
    return `<div style="text-align:center;padding:60px 20px;color:#8B7355">
      ${icons.briefcase.replace('class="icon"', 'class="icon" style="width:32px;height:32px;opacity:0.4;margin-bottom:12px"')}
      <div class="serif" style="font-size:18px;color:#0F1419">No applications submitted yet</div>
      <div style="font-size:13px;margin-top:6px">Mark a firm as "Applied" in the dashboard to track it here.</div>
    </div>`;
  }
  return `
    <div class="serif" style="font-size:13px;color:#8B7355;margin-bottom:16px;font-style:italic">Your active applications, most recent first.</div>
    ${submitted.map(c => `
      <div class="card" style="padding:14px 16px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div>
            <div class="serif" style="font-size:16px;font-weight:600">${escapeHtml(c.name)}</div>
            <div style="font-size:12px;color:#5C5040;margin-top:2px">${escapeHtml(c.role)}</div>
            ${c.appliedDate ? `<div class="mono" style="font-size:10px;color:#8B7355;margin-top:6px">Applied ${escapeHtml(c.appliedDate)}</div>` : ''}
          </div>
          ${badgeHtml(c.status)}
        </div>
        <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
          ${['applied','interview','offer','rejected'].map(s => `<button class="status-pill ${c.status === s ? 'active' : ''}" style="${c.status === s ? 'background:'+STATUSES[s].color+';border-color:'+STATUSES[s].color : ''}" data-setstatus="${c.id}|${s}">${STATUSES[s].label}</button>`).join('')}
        </div>
      </div>
    `).join('')}
  `;
}

function alertsHtml() {
  return `
    <div class="intro">
      <h2>Real-time alerts</h2>
      <p>This tracker runs in your browser, so it can't ping you while you're studying. Set up these external services once and they'll email you the moment relevant roles open. Tick each as you set it up.</p>
    </div>
    ${EXTERNAL_ALERTS.map(a => `
      <div class="alert-card" data-toggle-alert="${a.id}">
        <div class="checkbox ${state.data.alerts[a.id] ? 'checked' : ''}">${state.data.alerts[a.id] ? '<svg viewBox="0 0 24 24" width="12" height="12" stroke="#FFF" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>' : ''}</div>
        <div class="alert-label ${state.data.alerts[a.id] ? 'done' : ''}">${escapeHtml(a.label)}</div>
        <a href="${escapeHtml(a.url)}" target="_blank" rel="noreferrer" style="color:#C84B31" onclick="event.stopPropagation()">${icons.external}</a>
      </div>
    `).join('')}
    <div style="margin-top:40px;padding-top:24px;border-top:1px solid #E5DDC8">
      <h3 class="serif" style="font-size:16px;font-weight:600;margin:0 0 10px">Workflow during Basisprüfung Lernphase</h3>
      <ol style="font-size:13px;color:#5C5040;line-height:1.7;padding-left:20px;margin:0">
        <li>Set up all 8 external alerts above (one-time, ~20 min).</li>
        <li>Mark firms where the 2027 cycle hasn't appeared yet (Goldman Sachs Summer Analyst, etc.) as <strong>"Not Open Yet"</strong> — they move to the Monitoring section.</li>
        <li>Open this tracker once a week — Sunday evening, 5 minutes.</li>
        <li>Click "Refresh live data" to pull current postings from Greenhouse-hosted firms.</li>
        <li>Check the Monitoring section — for each firm, click "Check & Open" to verify if 2027 has opened. If yes, click "Cycle opened" to move it to Action.</li>
        <li>Click "Open top 5 urgent" to batch-check the most time-sensitive firms.</li>
        <li>Mark status. Close. Back to studying.</li>
        <li>After Basisprüfung (late Aug), switch to twice-weekly checks.</li>
      </ol>
    </div>
    <div class="tools">
      <button class="tool-btn" id="export-btn">${icons.download} Export data (.json)</button>
      <button class="tool-btn" id="import-btn">${icons.upload} Import data</button>
      <button class="tool-btn danger" id="reset-btn">${icons.trash} Reset all</button>
    </div>
    <div style="font-size:11px;color:#8B7355;margin-top:12px;line-height:1.5">Tip: Export from Mac → transfer file to phone → import to sync progress.</div>
  `;
}

function cardHtml(c, urgent) {
  const isOpen = state.openCard === c.id;
  const catColor = CAT_COLORS[c.category] || '#5C5040';
  const verify = verifyLabel(c);
  const isStale = verify.cls === 'stale';
  const hasLive = !!c.greenhouseSlug;
  return `
    <div class="card card-enter ${urgent ? 'urgent' : ''} ${isStale ? 'stale' : ''}">
      <div class="card-head" data-toggle-card="${c.id}">
        <div class="card-row"><div class="card-main">
          <div class="card-top">
            <span class="card-name">${escapeHtml(c.name)}</span>
            ${c.priority === 1 ? icons.star : ''}
            <span class="cat-tag" style="color:${catColor};background:${catColor}12">${escapeHtml(c.category)}</span>
            ${hasLive ? '<span class="live-badge"><span class="live-dot"></span>LIVE</span>' : ''}
          </div>
          <div class="card-role">${escapeHtml(c.role)}</div>
          <div class="card-window ${urgent ? 'urgent' : ''}">${escapeHtml(c.openWindow)}</div>
          <div class="card-verify ${verify.cls}">${escapeHtml(verify.text)}</div>
        </div>
        <div style="transform:${isOpen ? 'rotate(180deg)' : 'none'};transition:transform 0.2s">${icons.chevronDown}</div></div>
      </div>
      ${isOpen ? cardBodyHtml(c) : ''}
    </div>
  `;
}

function cardBodyHtml(c) {
  const isEditing = state.editingNote === c.id;
  const hasLive = !!c.greenhouseSlug;
  const isMonitoring = c.status === 'not_open';
  return `
    <div class="card-body">
      ${c.note ? `<div class="card-quote">"${escapeHtml(c.note)}"</div>` : ''}
      ${isMonitoring ? `<div style="background:#FEF3C7;border:1px solid #FCD34D;padding:8px 10px;border-radius:2px;margin-top:8px;font-size:12px;color:#78350F;line-height:1.4">⏳ <strong>Monitoring</strong> — 2027 cycle not yet posted. Click "Verify & Open" to check, then "Cycle opened" if the role is now live.</div>` : ''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        <button class="btn btn-primary" data-verify-open="${c.id}|${escapeHtml(c.url)}">${isMonitoring ? 'Check & Open' : 'Verify & Open'} ${icons.external}</button>
        ${isMonitoring ? `<button class="btn" style="background:#15803D;color:#FFF" data-cycle-opened="${c.id}">✓ Cycle opened — move to To Do</button>` : `<button class="btn btn-secondary ${c.status === 'applied' ? 'active' : ''}" data-mark-applied="${c.id}">${c.status === 'applied' ? '✓ Applied' : 'Mark applied'}</button>`}
        ${hasLive ? `<button class="btn btn-live" data-refresh-live="${c.id}">${state.liveFetching[c.id] ? '<span class="spin">⟳</span>' : icons.refresh} Refresh live</button>` : ''}
        ${!isMonitoring ? `<button class="btn btn-skip" data-setstatus="${c.id}|skipped">Skip</button>` : `<button class="btn btn-skip" data-setstatus="${c.id}|skipped">Skip</button>`}
      </div>
      ${hasLive ? liveSectionHtml(c) : ''}
      <div style="display:flex;gap:4px;margin-top:10px;flex-wrap:wrap">
        ${Object.entries(STATUSES).map(([k, s]) => `<button class="status-pill ${c.status === k ? 'active' : ''}" style="${c.status === k ? 'background:'+s.color+';color:#FFF;border-color:'+s.color : ''}" data-setstatus="${c.id}|${k}">${s.label}</button>`).join('')}
      </div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid #F0E8D4">
        ${isEditing ? `
          <textarea class="note-input" id="note-draft" placeholder="Your notes...">${escapeHtml(state.noteDraft)}</textarea>
          <div style="display:flex;gap:6px;margin-top:6px">
            <button class="btn" style="background:#15803D;color:#FFF" data-save-note="${c.id}">Save</button>
            <button class="btn" style="color:#8B7355" data-cancel-note="1">Cancel</button>
          </div>
        ` : `<button class="note-btn" data-edit-note="${c.id}">${icons.edit}${c.userNote ? escapeHtml(c.userNote.slice(0, 60) + (c.userNote.length > 60 ? '...' : '')) : 'Add personal note'}</button>`}
      </div>
    </div>
  `;
}

function liveSectionHtml(c) {
  const slug = c.greenhouseSlug + (c.greenhouseEu ? ':eu' : '');
  const cached = state.data.live[slug];
  const isFetching = state.liveFetching[c.id];

  if (isFetching && !cached) {
    return `<div class="live-section loading"><div class="live-title loading">Loading live data...</div></div>`;
  }
  if (!cached) {
    return `<div class="live-section loading"><div class="live-title loading">Click "Refresh live" to fetch current postings from Greenhouse</div></div>`;
  }
  const data = cached.data;
  if (!data || !data.jobs) {
    return `<div class="live-section error"><div class="live-title error">Live fetch unavailable</div><div style="font-size:11px;color:#5C5040">API blocked or slug changed. Use Verify & Open instead.</div></div>`;
  }
  const interns = filterInternshipJobs(data.jobs);
  const fetchedDate = new Date(cached.time).toLocaleString();
  return `
    <div class="live-section">
      <div class="live-title">● LIVE — ${interns.length} intern role${interns.length === 1 ? '' : 's'} found (of ${data.total} total) · fetched ${fetchedDate}</div>
      ${interns.length === 0 ? '<div style="font-size:12px;color:#5C5040;font-style:italic">No intern/2027 postings live right now. Check again later.</div>' : interns.slice(0, 6).map(j => `
        <div class="live-job">
          <div class="live-job-title"><a href="${escapeHtml(j.url)}" target="_blank" rel="noreferrer">${escapeHtml(j.title)} ${icons.external}</a></div>
          <div class="live-job-meta">${escapeHtml(j.location || 'Location TBA')}${j.updated ? ' · updated ' + new Date(j.updated).toLocaleDateString() : ''}</div>
        </div>
      `).join('')}
      ${interns.length > 6 ? `<div style="font-size:11px;color:#8B7355;margin-top:6px">+ ${interns.length - 6} more</div>` : ''}
    </div>
  `;
}

function badgeHtml(status) {
  const s = STATUSES[status] || STATUSES.todo;
  return `<span class="badge" style="background:${s.bg};color:${s.color}">${s.label}</span>`;
}

/* ============================================================
   EVENT LISTENERS
   ============================================================ */

function attachListeners() {
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => setState({ view: el.dataset.tab, openCard: null });
  });
  document.querySelectorAll('[data-toggle-card]').forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest('a, button')) return;
      const id = el.dataset.toggleCard;
      setState({ openCard: state.openCard === id ? null : id, editingNote: null });
    };
  });
  document.querySelectorAll('[data-verify-open]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const [id, url] = el.dataset.verifyOpen.split('|');
      verifyAndOpen(id, url);
    };
  });
  document.querySelectorAll('[data-mark-applied]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const today = new Date().toISOString().split('T')[0];
      updateApp(el.dataset.markApplied, { status: 'applied', appliedDate: today });
    };
  });
  document.querySelectorAll('[data-setstatus]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const [id, s] = el.dataset.setstatus.split('|');
      const patch = { status: s };
      if (s === 'applied' && !state.data.apps[id]?.appliedDate) patch.appliedDate = new Date().toISOString().split('T')[0];
      updateApp(id, patch);
    };
  });
  document.querySelectorAll('[data-filter]').forEach(el => {
    el.onclick = () => setState({ filter: el.dataset.filter, openCard: null });
  });
  document.querySelectorAll('[data-statusfilter]').forEach(el => {
    el.onclick = () => setState({ statusFilter: el.dataset.statusfilter, openCard: null });
  });
  document.querySelectorAll('[data-toggle-alert]').forEach(el => {
    el.onclick = (e) => { if (e.target.closest('a')) return; toggleAlert(el.dataset.toggleAlert); };
  });
  document.querySelectorAll('[data-edit-note]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.editNote;
      setState({ editingNote: id, noteDraft: state.data.apps[id]?.note || '' });
    };
  });
  document.querySelectorAll('[data-save-note]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const draft = document.getElementById('note-draft')?.value || '';
      updateApp(el.dataset.saveNote, { note: draft });
      setState({ editingNote: null });
    };
  });
  document.querySelectorAll('[data-cancel-note]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); setState({ editingNote: null }); };
  });
  document.querySelectorAll('[data-refresh-live]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); refreshSingleLive(el.dataset.refreshLive); };
  });
  document.querySelectorAll('[data-cycle-opened]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.cycleOpened;
      const now = new Date();
      const currentMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
      updateApp(id, { status: 'todo', cycleOpenedAt: new Date().toISOString(), lastChecked: new Date().toISOString() });
    };
  });
  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    searchInput.oninput = (e) => {
      state.search = e.target.value;
      const main = document.querySelector('main .wrap');
      if (main) {
        main.innerHTML = viewHtml();
        attachListeners();
        const ni = document.getElementById('search-input');
        if (ni) { ni.focus(); ni.setSelectionRange(state.search.length, state.search.length); }
      }
    };
  }
  const noteDraft = document.getElementById('note-draft');
  if (noteDraft) noteDraft.oninput = (e) => { state.noteDraft = e.target.value; };

  document.getElementById('batch-open-btn')?.addEventListener('click', batchOpenUrgent);
  document.getElementById('refresh-live-btn')?.addEventListener('click', refreshLiveData);
  document.getElementById('export-btn')?.addEventListener('click', exportData);
  document.getElementById('import-btn')?.addEventListener('click', importData);
  document.getElementById('reset-btn')?.addEventListener('click', resetAll);
}

/* ============================================================
   INIT
   ============================================================ */

render();

// Auto-refresh live data on first load (stale cache only)
(async () => {
  const liveCompanies = COMPANIES.filter(c => c.greenhouseSlug);
  const needsRefresh = liveCompanies.some(c => {
    const key = c.greenhouseSlug + (c.greenhouseEu ? ':eu' : '');
    const cached = state.data.live[key];
    return !cached || (Date.now() - cached.time > LIVE_CACHE_TTL);
  });
  if (needsRefresh) {
    await refreshLiveData();
  }
})();
</script>
</body>
</html>
