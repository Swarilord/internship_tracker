const STORAGE_KEY = 'eth-internship-tracker-v3';
const LIVE_CACHE_TTL = 3600000; // 1 hour
const CONFIRM_FRESH_DAYS = 45;  // a manual "confirmed open" stays valid this long

const loadData = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
    // Migrate v1/v2: keep apps + alerts, rebuild live cache
    for (const oldKey of ['eth-internship-tracker-v2', 'eth-internship-tracker-v1']) {
      const oldRaw = localStorage.getItem(oldKey);
      if (oldRaw) {
        const parsed = JSON.parse(oldRaw);
        const migrated = { apps: parsed.apps || {}, alerts: parsed.alerts || {}, live: {}, lastFullRefresh: null };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
        return migrated;
      }
    }
    return { apps: {}, alerts: {}, live: {}, lastFullRefresh: null };
  } catch { return { apps: {}, alerts: {}, live: {}, lastFullRefresh: null }; }
};

const saveData = (d) => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
  catch (e) {
    // Quota: drop the largest part of the cache (seen-URL sets) and retry once
    try {
      Object.values(d.live || {}).forEach(v => { if (v && v.seen) v.seen = v.seen.slice(-60); });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    } catch (e2) { console.error(e2); }
  }
};

      try {
        const parsed = JSON.parse(ev.target.result);
        if (parsed && typeof parsed === 'object' && parsed.apps !== undefined) {
          if (confirm('Import data and overwrite current state?')) {

/* ============================================================
   LIVE DATA — multi-ATS (Greenhouse / Greenhouse EU / Lever)
   These public job-board APIs allow cross-origin requests, so
   the page can fetch them directly from GitHub Pages.
   ============================================================ */

// Title looks like an early-careers role?
const INC_RE = /intern|summer|spring|insight|discover|launchpad|futurefocus|future ?focus|graduate|trainee|early.?career|off.?cycle|working student|werkstudent|new grad|campus|ascent|e-?house|2027/i;
const EXC_RE = /\b(phd|ph\.d|senior|principal|director|head of|vp\b|recruiter)\b/i;
// Locations most useful from Zurich
const EU_RE = /amsterdam|london|zurich|zürich|zug|geneva|frankfurt|paris|dublin|madrid|milan|stockholm|copenhagen|aarhus|europe|emea|netherlands|switzerland|germany|austria|united kingdom|\buk\b|remote/i;

function isEarlyCareer(title) {
  if (/intern/i.test(title)) return !/\bphd\b|\bph\.d\b/i.test(title);
  return INC_RE.test(title) && !EXC_RE.test(title);
}

function rankJobs(jobs) {
  // EU-relevant roles first, then by recency
  return jobs.slice().sort((a, b) => {
    const ae = EU_RE.test(a.location || '') ? 0 : 1;
    const be = EU_RE.test(b.location || '') ? 0 : 1;
    if (ae !== be) return ae - be;
    return (b.updated || '').localeCompare(a.updated || '');
  });
}

async function fetchBoard(c) {
  const key = c.id;
  const prev = state.data.live[key];
  if (prev && prev.ok && (Date.now() - prev.time < LIVE_CACHE_TTL)) return prev;

  let jobs = null, total = 0;
  try {
    if (c.ats === 'lever') {
      const res = await fetch('https://api.lever.co/v0/postings/' + c.atsSlug + '?mode=json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const arr = await res.json();
      total = arr.length;
      jobs = arr.map(j => ({
        title: j.text || '',
        location: (j.categories && j.categories.location) || '',
        url: j.hostedUrl || '',
        updated: j.createdAt ? new Date(j.createdAt).toISOString() : '',
      }));
    } else {
      const base = c.atsEu ? 'https://boards-api.eu.greenhouse.io' : 'https://boards-api.greenhouse.io';
      const res = await fetch(base + '/v1/boards/' + c.atsSlug + '/jobs');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      const all = json.jobs || [];
      total = all.length;
      jobs = all.map(j => ({
        title: j.title || '',
        location: (j.location && j.location.name) || '',
        url: j.absolute_url || '',
        updated: j.updated_at || '',
      }));
    }
  } catch (e) {
    const entry = { time: Date.now(), ok: false, error: String(e && e.message || e), seen: (prev && prev.seen) || [] };
    state.data.live[key] = entry;
    return entry;
  }

  const matches = rankJobs(jobs.filter(j => isEarlyCareer(j.title))).slice(0, 40);
  const prevSeen = new Set((prev && prev.seen) || []);
  const hadPrev = prev && prev.seen && prev.seen.length > 0;
  matches.forEach(m => { m.isNew = hadPrev && !prevSeen.has(m.url); });
  const newCount = matches.filter(m => m.isNew).length;
  const seen = Array.from(new Set([...((prev && prev.seen) || []), ...matches.map(m => m.url)])).slice(-200);

  const entry = { time: Date.now(), ok: true, total, matches, newCount, seen };
  state.data.live[key] = entry;
  return entry;
}

const liveFirms = () => COMPANIES.filter(c => c.atsSlug);

async function refreshLiveData() {
  const firms = liveFirms();
  firms.forEach(c => { state.liveFetching[c.id] = true; });
  render();
  await Promise.all(firms.map(async (c) => {
    const entry = await fetchBoard(c);
    state.liveFetching[c.id] = false;
    if (entry.ok) updateApp(c.id, { lastChecked: new Date().toISOString() }, { silent: true });
  }));
  state.data.lastFullRefresh = new Date().toISOString();
  persist();
  render();
}

async function refreshSingleLive(id) {
  const c = COMPANIES.find(x => x.id === id);
  if (!c || !c.atsSlug) return;
  state.liveFetching[id] = true;
  render();
  // Force refetch by expiring the cache for this firm
  if (state.data.live[id]) state.data.live[id].time = 0;
  const entry = await fetchBoard(c);
  state.liveFetching[id] = false;
  if (entry.ok) updateApp(id, { lastChecked: new Date().toISOString() }, { silent: true });
  persist();
  render();
}

/* ============================================================
   ATTENTION ENGINE
   A firm only lands in "Open now" when something real says so:
   either its live board shows matching roles, or you confirmed
   it yourself. Static window guesses can at most ask you to
   verify — they can never claim a firm is open.
   ============================================================ */

const CURRENT_REF = new Date();
const monthsFromNow = (mStr) => {
  const [y, m] = mStr.split('-').map(Number);
  return (y - CURRENT_REF.getFullYear()) * 12 + (m - 1 - CURRENT_REF.getMonth());
};

const daysSince = (iso) => {
  if (!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
};

const liveStatus = (c) => {
  if (!c.atsSlug) return 'none';            // no integration
  const entry = state.data.live[c.id];
  if (!entry) return 'unknown';             // never fetched
  if (!entry.ok) return 'error';            // board unreachable / slug moved
  return entry.matches.length > 0 ? 'open' : 'quiet';
};

const enrich = (c) => {
  const app = state.data.apps[c.id] || {};
  const live = liveStatus(c);
  const confirmAge = daysSince(app.confirmedOpenAt);
  const confirmedOpen = confirmAge !== null && confirmAge <= CONFIRM_FRESH_DAYS;
  return {
    ...c,
    tier: tierOf(c),
    status: app.status || 'todo',
    userNote: app.note || '',
    appliedDate: app.appliedDate,
    lastChecked: app.lastChecked,
    confirmedOpenAt: app.confirmedOpenAt,
    confirmedOpen,
    live,
    liveEntry: state.data.live[c.id],
  };
};

// Buckets: open_now | verify | monitoring | coming_up | later | done
function bucketOf(c) {
  if (['applied', 'interview', 'offer', 'rejected', 'skipped'].includes(c.status)) return 'done';
  if (c.live === 'open') return 'open_now';                 // live board has matching roles → real signal
  if (c.confirmedOpen) return 'open_now';                   // you verified it yourself recently
  if (c.status === 'not_open') return 'monitoring';         // you checked: cycle not posted
  if (c.live === 'quiet') return 'monitoring';              // live board fetched, nothing matching → auto-monitor
  const m = monthsFromNow(c.urgencyMonth);
  if (m <= 1) return 'verify';                              // window says open/near, but nothing confirms it
  if (m <= 4) return 'coming_up';
  return 'later';
}

const byPriorityThenMonth = (a, b) => (a.priority - b.priority) || a.urgencyMonth.localeCompare(b.urgencyMonth);
const byMonthThenPriority = (a, b) => a.urgencyMonth.localeCompare(b.urgencyMonth) || (a.priority - b.priority);

function buckets() {
  const all = COMPANIES.map(enrich);
  const out = { open_now: [], verify: [], monitoring: [], coming_up: [], later: [], done: [] };
  all.forEach(c => out[bucketOf(c)].push(c));
  out.open_now.sort((a, b) => {
    const an = (a.liveEntry && a.liveEntry.newCount) || 0;
    const bn = (b.liveEntry && b.liveEntry.newCount) || 0;
    if (an !== bn) return bn - an;
    return byPriorityThenMonth(a, b);
  });
  out.verify.sort(byPriorityThenMonth);
  out.monitoring.sort(byPriorityThenMonth);
  out.coming_up.sort(byMonthThenPriority);
  out.later.sort(byMonthThenPriority);
  return out;
}

const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const verifyLabel = (c) => {
  if (c.live === 'open') {
    const e = c.liveEntry;
    return { text: 'Live board: ' + e.matches.length + ' matching role' + (e.matches.length === 1 ? '' : 's') + (e.newCount ? ' (' + e.newCount + ' new)' : ''), cls: 'fresh' };
  }
  if (c.live === 'quiet') return { text: 'Live board: no matching roles yet', cls: '' };
  if (c.live === 'error') return { text: 'Live board unreachable — verify manually', cls: 'stale' };
  if (c.confirmedOpen) return { text: 'You confirmed open ' + daysSince(c.confirmedOpenAt) + 'd ago', cls: 'fresh' };
  const d = daysSince(c.lastChecked);
  const isMonitoring = c.status === 'not_open';
  if (d === null) return { text: isMonitoring ? 'Not checked yet' : 'Not verified', cls: 'stale' };
  if (d === 0) return { text: 'Checked today', cls: 'fresh' };
  if (d === 1) return { text: 'Checked yesterday', cls: 'fresh' };
  if (d <= 6) return { text: 'Checked ' + d + 'd ago', cls: 'fresh' };
  if (isMonitoring) return { text: 'Checked ' + d + 'd ago — recheck weekly', cls: 'stale' };
  return { text: 'Verified ' + d + 'd ago — stale', cls: 'stale' };
};

const batchOpenVerify = () => {
  const b = buckets();
  const targets = b.verify.slice(0, 5);
  if (targets.length === 0) { alert('Nothing to verify right now.'); return; }
  let blocked = 0;
  const now = new Date().toISOString();
  targets.forEach((c, i) => {
    setTimeout(() => {
      const w = window.open(c.url, '_blank', 'noopener,noreferrer');
      if (!w) blocked++;
      state.data.apps[c.id] = { ...(state.data.apps[c.id] || {}), lastChecked: now };
      if (i === targets.length - 1) {
        persist();
        if (blocked > 0) alert('Your browser blocked ' + blocked + ' popup(s). Allow popups for this page and try again.');
        render();
      }
    }, i * 100);
  });
};

function render() {
  const root = document.getElementById('root');
  root.innerHTML = '<div class="app">' + headerHtml() + tabsHtml() + '<main><div class="wrap">' + viewHtml() + '</div></main></div>';
  attachListeners();
  // Keep sticky tabs flush under the header at any header height (mobile-safe)
  const header = root.querySelector('.header');
  const tabs = root.querySelector('.tabs');
  if (header && tabs) tabs.style.top = header.offsetHeight + 'px';
}

function computeStats() {
  const all = COMPANIES.map(enrich);
  const s = { total: all.length, todo: 0, not_open: 0, applied: 0, interview: 0, offer: 0, rejected: 0, skipped: 0 };
  all.forEach(c => { s[c.status] = (s[c.status] || 0) + 1; });
  return s;
}

function headerHtml() {
  const stats = computeStats();

    + '</div></div></header>';
}

  ];
  return '<nav class="tabs"><div class="wrap"><div class="tabs-inner">'
    + tabs.map(t => '<button class="tab ' + (state.view === t.id ? 'active' : '') + '" data-tab="' + t.id + '">' + icons[t.icon] + ' ' + t.label + (t.count ? ' <span class="tab-count">' + t.count + '</span>' : '') + '</button>').join('')
    + '</div></div></nav>';
}

function viewHtml() {
  if (state.view === 'dashboard') return dashboardHtml();
  if (state.view === 'all') return allFirmsHtml();
  if (state.view === 'submitted') return submittedHtml();
  if (state.view === 'alerts') return alertsHtml();
  return '';
}

function dashboardHtml() {
  const b = buckets();
  const liveCount = liveFirms().length;
  const fetching = Object.values(state.liveFetching).some(Boolean);
  const lastRefresh = state.data.lastFullRefresh ? new Date(state.data.lastFullRefresh).toLocaleString() : 'never';
  const totalNew = liveFirms().reduce((n, c) => n + ((state.data.live[c.id] && state.data.live[c.id].newCount) || 0), 0);

  const verifyShown = state.showAllVerify ? b.verify : b.verify.slice(0, 8);

  return ''
    + '<div class="disclaimer">'
    +   '<div class="disclaimer-title">How attention works now</div>'
    +   '<div class="disclaimer-body">A firm only appears in <strong>Open now</strong> when its live job board actually shows a matching intern/insight role (' + liveCount + ' firms are wired to Greenhouse/Lever APIs), or when you pressed "Confirmed open" after checking yourself. Date-based guesses can only ask you to <strong>verify</strong> — they can no longer fake urgency. Firms whose live board shows nothing relevant are parked in Monitoring automatically.</div>'
    + '</div>'

    + '<div class="batch-bar">'
    +   '<div class="batch-bar-text"><strong>' + b.open_now.length + '</strong> open · <strong>' + b.verify.length + '</strong> to verify · <strong>' + b.monitoring.length + '</strong> monitoring' + (totalNew ? ' · <strong style="color:#C84B31">' + totalNew + ' new posting' + (totalNew === 1 ? '' : 's') + '</strong>' : '') + '<br><span class="mono" style="font-size:10px">last live refresh: ' + escapeHtml(lastRefresh) + '</span></div>'
    +   '<div style="display:flex;gap:6px;flex-wrap:wrap">'
    +     '<button class="batch-btn secondary" id="refresh-live-btn">' + (fetching ? '<span class="spin">⟳</span>' : icons.refresh) + ' Refresh live boards</button>'
    +     '<button class="batch-btn" id="batch-open-btn" ' + (b.verify.length === 0 ? 'disabled style="opacity:0.4"' : '') + '>' + icons.zap + ' Open top 5 to verify</button>'
    +   '</div>'
    + '</div>'

    + statsHtml(b)

    + '<section class="section">'
    +   '<div class="section-head green"><div>'
    +     '<h2 class="section-title green">Open now — apply</h2>'
    +     '<div class="section-sub">' + b.open_now.length + ' firm' + (b.open_now.length === 1 ? '' : 's') + ' with confirmed live openings</div>'
    +   '</div></div>'
    +   (b.open_now.length === 0 ? '<div class="empty">Nothing confirmed open. Hit "Refresh live boards", or verify a firm and mark it confirmed.</div>' : b.open_now.map(c => cardHtml(c, 'open')).join(''))
    + '</section>'

    + '<section class="section">'
    +   '<div class="section-head accent"><div>'
    +     '<h2 class="section-title accent">Verify this week</h2>'
    +     '<div class="section-sub">' + b.verify.length + ' firm' + (b.verify.length === 1 ? '' : 's') + ' whose window should be open — confirm or park them</div>'
    +   '</div></div>'
    +   (b.verify.length === 0 ? '<div class="empty">Nothing to verify. Use this time on your Basisprüfung.</div>'
       : verifyShown.map(c => cardHtml(c, 'verify')).join('')
         + (b.verify.length > 8 ? '<button class="show-more" id="toggle-verify">' + (state.showAllVerify ? 'Show fewer' : 'Show all ' + b.verify.length) + '</button>' : ''))
    + '</section>'

    + (b.monitoring.length > 0 ? ''
      + '<section class="section">'
      +   '<div class="section-head" style="border-bottom-color:#D97706"><div>'
      +     '<h2 class="section-title" style="color:#92400E">Monitoring</h2>'
      +     '<div class="section-sub">' + b.monitoring.length + ' firm' + (b.monitoring.length === 1 ? '' : 's') + ' with no live posting yet · rechecks automatically where wired, weekly otherwise</div>'
      +   '</div></div>'
      +   b.monitoring.map(c => cardHtml(c, 'monitor')).join('')
      + '</section>' : '')

    + '<section class="section">'
    +   '<div class="section-head"><div>'
    +     '<h2 class="section-title">Coming up</h2>'
    +     '<div class="section-sub">' + b.coming_up.length + ' opening in the next 2–4 months</div>'
    +   '</div></div>'
    +   (b.coming_up.length === 0 ? '<div class="empty">Nothing in the queue.</div>' : b.coming_up.map(c => cardHtml(c, '')).join(''))
    + '</section>'

    + (b.later.length > 0 ? ''
      + '<section class="section">'
      +   '<div class="section-head"><div>'
      +     '<h2 class="section-title">Later</h2>'
      +     '<div class="section-sub">' + b.later.length + ' firms, track but don\'t worry yet</div>'
      +   '</div></div>'
      +   b.later.map(c => cardHtml(c, '')).join('')
      + '</section>' : '');
}

function statsHtml(b) {
  const stats = computeStats();
  const tiles = [
    [String(b.open_now.length), 'Open now', '#15803D'],
    [String(b.verify.length), 'To verify', '#C84B31'],
    [String(stats.applied), 'Applied', '#2563EB'],
    [String(stats.interview + stats.offer), 'Intv + Offer', '#7C3AED'],
  ];
  return '<div class="stats">' + tiles.map(t => '<div class="stat"><div class="stat-num" style="color:' + t[2] + '">' + t[0] + '</div><div class="stat-lbl">' + t[1] + '</div></div>').join('') + '</div>';
}

function allFirmsHtml() {
  let filtered = COMPANIES.map(enrich);
  if (state.filter !== 'All') filtered = filtered.filter(c => c.category === state.filter);
  if (state.tierFilter !== 'all') filtered = filtered.filter(c => c.tier === state.tierFilter);
  if (state.statusFilter === 'open_live') filtered = filtered.filter(c => c.live === 'open');
  else if (state.statusFilter !== 'all') filtered = filtered.filter(c => c.status === state.statusFilter);
  if (state.search) {
    const q = state.search.toLowerCase();
    filtered = filtered.filter(c => (c.name + ' ' + c.role + ' ' + (c.note || '')).toLowerCase().includes(q));
  }
  filtered.sort(byMonthThenPriority);

  return '<div style="margin-bottom:20px">'
    + '<div class="search-wrap">' + icons.search + '<input class="search-input" id="search-input" placeholder="Search firms..." value="' + escapeHtml(state.search) + '" /></div>'
    + '<div class="chip-row">' + CATEGORIES.map(cat => '<button class="chip ' + (state.filter === cat ? 'active' : '') + '" data-filter="' + escapeHtml(cat) + '">' + escapeHtml(cat) + '</button>').join('') + '</div>'
    + '<div class="chip-row">' + [['all','All tiers'],['safer','Safer — high interview odds'],['match','Match'],['reach','Reach']].map(p => '<button class="chip chip-sm ' + (state.tierFilter === p[0] ? 'active' : '') + '" data-tierfilter="' + p[0] + '">' + p[1] + '</button>').join('') + '</div>'
    + '<div class="chip-row">' + [['all','All status'],['open_live','● Live open'],['todo','To do'],['not_open','Not open yet'],['applied','Applied'],['interview','Interview'],['offer','Offer'],['rejected','Rejected'],['skipped','Skipped']].map(p => '<button class="chip chip-sm ' + (state.statusFilter === p[0] ? 'active' : '') + '" data-statusfilter="' + p[0] + '">' + p[1] + '</button>').join('') + '</div>'
    + '</div>'
    + '<div class="mono" style="font-size:11px;color:#8B7355;margin-bottom:12px">' + filtered.length + ' result' + (filtered.length === 1 ? '' : 's') + '</div>'
    + (filtered.length === 0 ? '<div class="empty">No firms match these filters.</div>' : filtered.map(c => cardHtml(c, '')).join(''));
}

function submittedHtml() {
  const submitted = COMPANIES.map(enrich).filter(c => ['applied','interview','offer'].includes(c.status))
    .sort((a, b) => (b.appliedDate || '').localeCompare(a.appliedDate || ''));
  if (submitted.length === 0) {
    return '<div style="text-align:center;padding:60px 20px;color:#8B7355">'
      + icons.briefcase.replace('class="icon"', 'class="icon" style="width:32px;height:32px;opacity:0.4;margin-bottom:12px"')
      + '<div class="serif" style="font-size:18px;color:#0F1419">No applications submitted yet</div>'
      + '<div style="font-size:13px;margin-top:6px">Mark a firm as "Applied" in the dashboard to track it here.</div></div>';
  }
  return '<div class="serif" style="font-size:13px;color:#8B7355;margin-bottom:16px;font-style:italic">Your active applications, most recent first.</div>'
    + submitted.map(c => '<div class="card" style="padding:14px 16px">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div>'
      + '<div class="serif" style="font-size:16px;font-weight:600">' + escapeHtml(c.name) + '</div>'
      + '<div style="font-size:12px;color:#5C5040;margin-top:2px">' + escapeHtml(c.role) + '</div>'
      + (c.appliedDate ? '<div class="mono" style="font-size:10px;color:#8B7355;margin-top:6px">Applied ' + escapeHtml(c.appliedDate) + '</div>' : '')
      + '</div>' + badgeHtml(c.status) + '</div>'
      + '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">'
      + ['applied','interview','offer','rejected'].map(s => '<button class="status-pill ' + (c.status === s ? 'active' : '') + '" style="' + (c.status === s ? 'background:' + STATUSES[s].color + ';border-color:' + STATUSES[s].color : '') + '" data-setstatus="' + c.id + '|' + s + '">' + STATUSES[s].label + '</button>').join('')
      + '</div></div>').join('');
}

function alertsHtml() {
  const firms = liveFirms();
  return '<div class="intro">'
    + '<h2>Live boards & alerts</h2>'
    + '<p>' + firms.length + ' firms are wired straight into their public Greenhouse/Lever job-board APIs — these update themselves every time you refresh. Everything else can\'t ping you from a static page, so set up these external alerts once and let them email you. Tick each as you set it up.</p>'
    + '</div>'

    + '<h3 class="serif" style="font-size:16px;font-weight:600;margin:0 0 10px">Live board health</h3>'
    + '<div class="card" style="padding:6px 14px;margin-bottom:24px">'
    + firms.map(c => {
        const e = state.data.live[c.id];
        let status, color;
        if (!e) { status = 'not fetched yet'; color = '#8B7355'; }
        else if (!e.ok) { status = 'unreachable — verify manually'; color = '#C84B31'; }
        else { status = e.matches.length + ' matching / ' + e.total + ' total roles'; color = e.matches.length ? '#15803D' : '#8B7355'; }
        return '<div class="health-row"><span>' + escapeHtml(c.name) + (c.verified ? '' : ' <span class="mono" style="font-size:9px;color:#8B7355">(best-effort slug)</span>') + '</span><span class="mono" style="font-size:10px;color:' + color + '">' + escapeHtml(status) + '</span></div>';
      }).join('')
    + '</div>'

    + '<h3 class="serif" style="font-size:16px;font-weight:600;margin:0 0 10px">External alerts</h3>'
    + EXTERNAL_ALERTS.map(a => '<div class="alert-card" data-toggle-alert="' + a.id + '">'
      + '<div class="checkbox ' + (state.data.alerts[a.id] ? 'checked' : '') + '">' + (state.data.alerts[a.id] ? '<svg viewBox="0 0 24 24" width="12" height="12" stroke="#FFF" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>' : '') + '</div>'
      + '<div class="alert-label ' + (state.data.alerts[a.id] ? 'done' : '') + '">' + escapeHtml(a.label) + '</div>'
      + '<a href="' + escapeHtml(a.url) + '" target="_blank" rel="noreferrer" style="color:#C84B31" onclick="event.stopPropagation()">' + icons.external + '</a>'
      + '</div>').join('')

    + '<div style="margin-top:40px;padding-top:24px;border-top:1px solid #E5DDC8">'
    + '<h3 class="serif" style="font-size:16px;font-weight:600;margin:0 0 10px">Weekly 5-minute workflow (Lernphase-proof)</h3>'
    + '<ol style="font-size:13px;color:#5C5040;line-height:1.7;padding-left:20px;margin:0">'
    + '<li>Set up the external alerts above (one-time, ~20 min).</li>'
    + '<li>Open the tracker once a week — it auto-refreshes the live boards on load.</li>'
    + '<li>Anything in <strong>Open now</strong>: open the linked posting directly and apply or mark Applied.</li>'
    + '<li>Anything in <strong>Verify this week</strong>: "Open top 5 to verify". On each careers page either press <strong>Confirmed open</strong> or <strong>Not posted → Monitor</strong>. Both silence the card until reality changes.</li>'
    + '<li>Close. Back to studying. After the Basisprüfung (late Aug), switch to twice-weekly.</li>'
    + '</ol></div>'

    + '<div class="tools">'
    + '<button class="tool-btn" id="export-btn">' + icons.download + ' Export data (.json)</button>'
    + '<button class="tool-btn" id="import-btn">' + icons.upload + ' Import data</button>'
    + '<button class="tool-btn danger" id="reset-btn">' + icons.trash + ' Reset all</button>'
    + '</div>'
    + '<div style="font-size:11px;color:#8B7355;margin-top:12px;line-height:1.5">Tip: Export from Mac → transfer file to phone → import to sync progress.</div>';
}

function cardHtml(c, variant) {
  const isOpen = state.openCard === c.id;
  const catColor = CAT_COLORS[c.category] || '#5C5040';
  const verify = verifyLabel(c);
  const isStale = verify.cls === 'stale';
  const hasLive = !!c.atsSlug;
  const e = c.liveEntry;
  let liveBadge = '';
  if (hasLive) {
    if (c.live === 'open') liveBadge = '<span class="live-badge"><span class="live-dot"></span>' + e.matches.length + ' LIVE' + (e.newCount ? ' · ' + e.newCount + ' NEW' : '') + '</span>';
    else if (c.live === 'quiet') liveBadge = '<span class="live-badge quiet">LIVE · 0</span>';
    else if (c.live === 'error') liveBadge = '<span class="live-badge off">LIVE OFF</span>';
    else liveBadge = '<span class="live-badge off">LIVE ?</span>';
  }
  const cardCls = variant === 'open' ? 'open-now' : (variant === 'verify' ? 'urgent' + (isStale ? ' stale' : '') : (isStale ? 'stale' : ''));
  return '<div class="card card-enter ' + cardCls + '">'
    + '<div class="card-head" data-toggle-card="' + c.id + '">'
    + '<div class="card-row"><div class="card-main">'
    + '<div class="card-top">'
    + '<span class="card-name">' + escapeHtml(c.name) + '</span>'
    + (c.priority === 1 ? icons.star : '')
    + '<span class="cat-tag" style="color:' + catColor + ';background:' + catColor + '12">' + escapeHtml(c.category) + '</span>'
    + liveBadge
    + '</div>'
    + '<div class="card-role">' + escapeHtml(c.role) + '</div>'
    + '<div class="card-window ' + (variant === 'open' ? 'open' : (variant === 'verify' ? 'urgent' : '')) + '">' + escapeHtml(c.live === 'open' ? 'Live postings up — see below' : c.openWindow) + '</div>'
    + '<div class="card-verify ' + verify.cls + '">' + escapeHtml(verify.text) + '</div>'
    + '</div>'
    + '<div style="transform:' + (isOpen ? 'rotate(180deg)' : 'none') + ';transition:transform 0.2s">' + icons.chevronDown + '</div></div>'
    + '</div>'
    + (isOpen ? cardBodyHtml(c, variant) : '')
    + '</div>';
}

function cardBodyHtml(c, variant) {
  const isEditing = state.editingNote === c.id;
  const hasLive = !!c.atsSlug;
  const isMonitoring = c.status === 'not_open';
  return '<div class="card-body">'
    + (c.note ? '<div class="card-quote">"' + escapeHtml(c.note) + '"</div>' : '')
    + (isMonitoring && c.live !== 'open' ? '<div style="background:#FEF3C7;border:1px solid #FCD34D;padding:8px 10px;border-radius:2px;margin-top:8px;font-size:12px;color:#78350F;line-height:1.4">⏳ <strong>Monitoring</strong> — cycle not yet posted. ' + (hasLive ? 'The live board will promote this automatically when a matching role appears.' : 'Click "Check & Open" weekly; press "Cycle opened" once it\'s live.') + '</div>' : '')
    + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'
    + '<button class="btn btn-primary" data-verify-open="' + c.id + '">' + (isMonitoring ? 'Check & Open' : 'Verify & Open') + ' ' + icons.external + '</button>'
    + (c.live !== 'open' && !c.confirmedOpen && !isMonitoring ? '<button class="btn btn-green" data-confirm-open="' + c.id + '">✓ Confirmed open</button>' : '')
    + (isMonitoring ? '<button class="btn btn-green" data-cycle-opened="' + c.id + '">✓ Cycle opened</button>' : '')
    + (!isMonitoring && c.live !== 'open' ? '<button class="btn btn-amber" data-set-monitor="' + c.id + '">Not posted → Monitor</button>' : '')
    + '<button class="btn btn-secondary ' + (c.status === 'applied' ? 'active' : '') + '" data-mark-applied="' + c.id + '">' + (c.status === 'applied' ? '✓ Applied' : 'Mark applied') + '</button>'
    + (hasLive ? '<button class="btn btn-live" data-refresh-live="' + c.id + '">' + (state.liveFetching[c.id] ? '<span class="spin">⟳</span>' : icons.refresh) + ' Refresh live</button>' : '')
    + '<button class="btn btn-skip" data-setstatus="' + c.id + '|skipped">Skip</button>'
    + '</div>'
    + (hasLive ? liveSectionHtml(c) : '')
    + '<div style="display:flex;gap:4px;margin-top:10px;flex-wrap:wrap">'
    + Object.entries(STATUSES).map(p => '<button class="status-pill ' + (c.status === p[0] ? 'active' : '') + '" style="' + (c.status === p[0] ? 'background:' + p[1].color + ';color:#FFF;border-color:' + p[1].color : '') + '" data-setstatus="' + c.id + '|' + p[0] + '">' + p[1].label + '</button>').join('')
    + '</div>'
    + '<div style="margin-top:14px;padding-top:12px;border-top:1px solid #F0E8D4">'
    + (isEditing
      ? '<textarea class="note-input" id="note-draft" placeholder="Your notes...">' + escapeHtml(state.noteDraft) + '</textarea>'
        + '<div style="display:flex;gap:6px;margin-top:6px">'
        + '<button class="btn btn-green" data-save-note="' + c.id + '">Save</button>'
        + '<button class="btn" style="color:#8B7355" data-cancel-note="1">Cancel</button></div>'
      : '<button class="note-btn" data-edit-note="' + c.id + '">' + icons.edit + (c.userNote ? escapeHtml(c.userNote.slice(0, 60) + (c.userNote.length > 60 ? '...' : '')) : 'Add personal note') + '</button>')
    + '</div>'
    + '</div>';
}

function liveSectionHtml(c) {
  const e = c.liveEntry;
  const isFetching = state.liveFetching[c.id];
  if (isFetching && !e) return '<div class="live-section loading"><div class="live-title loading">Loading live data...</div></div>';
  if (!e) return '<div class="live-section loading"><div class="live-title loading">Click "Refresh live" to fetch current postings</div></div>';
  if (!e.ok) return '<div class="live-section error"><div class="live-title error">Live board unreachable</div><div style="font-size:11px;color:#5C5040">Slug may have moved or the API is blocked (' + escapeHtml(e.error || '') + '). Use Verify &amp; Open instead.</div></div>';
  const fetchedDate = new Date(e.time).toLocaleString();
  return '<div class="live-section">'
    + '<div class="live-title">● LIVE — ' + e.matches.length + ' matching role' + (e.matches.length === 1 ? '' : 's') + ' (of ' + e.total + ' total) · fetched ' + escapeHtml(fetchedDate) + '</div>'
    + (e.matches.length === 0
      ? '<div style="font-size:12px;color:#5C5040;font-style:italic">No intern/insight/2027 postings live right now. This firm sits in Monitoring until something appears.</div>'
      : e.matches.slice(0, 6).map(j => '<div class="live-job">'
        + '<div class="live-job-title"><a href="' + escapeHtml(j.url) + '" target="_blank" rel="noreferrer">' + escapeHtml(j.title) + ' ' + icons.external + '</a>'
        + (EU_RE.test(j.location || '') ? '<span class="region-tag">EU</span>' : '')
        + (j.isNew ? '<span class="new-tag">NEW</span>' : '')
        + '</div>'
        + '<div class="live-job-meta">' + escapeHtml(j.location || 'Location TBA') + (j.updated ? ' · updated ' + escapeHtml(new Date(j.updated).toLocaleDateString()) : '') + '</div>'
        + '</div>').join('')
        + (e.matches.length > 6 ? '<div style="font-size:11px;color:#8B7355;margin-top:6px">+ ' + (e.matches.length - 6) + ' more</div>' : ''))
    + '</div>';
}

function badgeHtml(status) {
  const s = STATUSES[status] || STATUSES.todo;
  return '<span class="badge" style="background:' + s.bg + ';color:' + s.color + '">' + s.label + '</span>';
}

/* ============================================================
   EVENT LISTENERS
   ============================================================ */

function attachListeners() {
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => setState({ view: el.dataset.tab, openCard: null });
  });
  document.querySelectorAll('[data-toggle-card]').forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest('a, button')) return;
      const id = el.dataset.toggleCard;
      setState({ openCard: state.openCard === id ? null : id, editingNote: null });
    };
  });
  document.querySelectorAll('[data-verify-open]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.verifyOpen;
      const c = COMPANIES.find(x => x.id === id);
      if (c) verifyAndOpen(id, c.url);
    };
  });
  document.querySelectorAll('[data-confirm-open]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const now = new Date().toISOString();
      updateApp(el.dataset.confirmOpen, { confirmedOpenAt: now, lastChecked: now, status: 'todo' });
    };
  });
  document.querySelectorAll('[data-set-monitor]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      updateApp(el.dataset.setMonitor, { status: 'not_open', confirmedOpenAt: null, lastChecked: new Date().toISOString() });
    };
  });
  document.querySelectorAll('[data-mark-applied]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const today = new Date().toISOString().split('T')[0];
      updateApp(el.dataset.markApplied, { status: 'applied', appliedDate: today });
    };
  });
  document.querySelectorAll('[data-setstatus]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const parts = el.dataset.setstatus.split('|');
      const id = parts[0], s = parts[1];
      const patch = { status: s };
      if (s === 'applied' && !(state.data.apps[id] && state.data.apps[id].appliedDate)) patch.appliedDate = new Date().toISOString().split('T')[0];
      updateApp(id, patch);
    };
  });
  document.querySelectorAll('[data-filter]').forEach(el => {
    el.onclick = () => setState({ filter: el.dataset.filter, openCard: null });
  });
  document.querySelectorAll('[data-statusfilter]').forEach(el => {
    el.onclick = () => setState({ statusFilter: el.dataset.statusfilter, openCard: null });
  });
  document.querySelectorAll('[data-tierfilter]').forEach(el => {
    el.onclick = () => setState({ tierFilter: el.dataset.tierfilter, openCard: null });
  });
  document.querySelectorAll('[data-toggle-alert]').forEach(el => {
    el.onclick = (e) => { if (e.target.closest('a')) return; toggleAlert(el.dataset.toggleAlert); };
  });
  document.querySelectorAll('[data-edit-note]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.editNote;
      setState({ editingNote: id, noteDraft: (state.data.apps[id] && state.data.apps[id].note) || '' });
    };
  });
  document.querySelectorAll('[data-save-note]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const draftEl = document.getElementById('note-draft');
      updateApp(el.dataset.saveNote, { note: draftEl ? draftEl.value : '' });
      setState({ editingNote: null });
    };
  });
  document.querySelectorAll('[data-cancel-note]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); setState({ editingNote: null }); };
  });
  document.querySelectorAll('[data-refresh-live]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); refreshSingleLive(el.dataset.refreshLive); };
  });
  document.querySelectorAll('[data-cycle-opened]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const now = new Date().toISOString();
      updateApp(el.dataset.cycleOpened, { status: 'todo', confirmedOpenAt: now, lastChecked: now });
    };
  });
  const toggleVerify = document.getElementById('toggle-verify');
  if (toggleVerify) toggleVerify.onclick = () => setState({ showAllVerify: !state.showAllVerify });

  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    searchInput.oninput = (e) => {
      state.search = e.target.value;
      const main = document.querySelector('main .wrap');
      if (main) {
        main.innerHTML = viewHtml();
        attachListeners();
        const ni = document.getElementById('search-input');
        if (ni) { ni.focus(); ni.setSelectionRange(state.search.length, state.search.length); }
      }
    };
  }
  const noteDraft = document.getElementById('note-draft');
  if (noteDraft) noteDraft.oninput = (e) => { state.noteDraft = e.target.value; };

  const batchBtn = document.getElementById('batch-open-btn');
  if (batchBtn) batchBtn.onclick = batchOpenVerify;
  const refreshBtn = document.getElementById('refresh-live-btn');
  if (refreshBtn) refreshBtn.onclick = refreshLiveData;
  const exportBtn = document.getElementById('export-btn');
  if (exportBtn) exportBtn.onclick = exportData;
  const importBtn = document.getElementById('import-btn');
  if (importBtn) importBtn.onclick = importData;
  const resetBtn = document.getElementById('reset-btn');
  if (resetBtn) resetBtn.onclick = resetAll;
}

/* ============================================================
   INIT
   ============================================================ */

render();

// Auto-refresh live boards on load when the cache is stale
(() => {
  const needsRefresh = liveFirms().some(c => {
    const e = state.data.live[c.id];
    return !e || (Date.now() - e.time > LIVE_CACHE_TTL);
  });
  if (needsRefresh) refreshLiveData();
})();
</script>
</body>
</html>
